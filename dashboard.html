<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niels Automatiseert — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a38;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #00e5a0;
    --orange: #ff9f43;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --dim: #3a3a50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* GLOW */
  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(108,99,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    top: -200px;
    left: -200px;
    z-index: 0;
  }

  /* SIDEBAR */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
  }

  .sidebar-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }

  .sidebar-logo span { color: var(--accent); }

  .sidebar-sub {
    font-family: 'Syne Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2.5rem;
  }

  .nav-label {
    font-family: 'Syne Mono', monospace;
    font-size: 0.6rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
  }

  .sidebar-stats {
    margin-top: auto;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .stat-item {
    margin-bottom: 1rem;
  }

  .stat-label {
    font-family: 'Syne Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.2rem;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--accent);
  }

  /* MAIN */
  .main {
    margin-left: 240px;
    padding: 2.5rem 2.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  /* TOPBAR */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
  }

  .topbar h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: -0.03em;
  }

  .topbar h1 span { color: var(--accent); }

  .btn-refresh {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .btn-refresh:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-refresh.loading .icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.4rem;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .stat-card:nth-child(1)::before { background: var(--accent); }
  .stat-card:nth-child(2)::before { background: var(--green); }
  .stat-card:nth-child(3)::before { background: var(--orange); }
  .stat-card:nth-child(4)::before { background: var(--accent2); }

  .stat-card-label {
    font-family: 'Syne Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .stat-card-value {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1;
  }

  .stat-card:nth-child(1) .stat-card-value { color: var(--accent); }
  .stat-card:nth-child(2) .stat-card-value { color: var(--green); }
  .stat-card:nth-child(3) .stat-card-value { color: var(--orange); }
  .stat-card:nth-child(4) .stat-card-value { color: var(--accent2); }

  /* LOADING */
  .loading-state {
    text-align: center;
    padding: 4rem;
    color: var(--muted);
  }

  .loading-dots {
    display: inline-flex;
    gap: 0.4rem;
    margin-top: 1rem;
  }

  .loading-dots span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* KLANTEN GRID */
  #klanten-grid {
    display: grid;
    gap: 1rem;
  }

  /* KLANT CARD */
  .klant-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
    transition: border-color 0.2s;
  }

  .klant-card:hover { border-color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }

  .klant-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 1.5rem;
    cursor: pointer;
    user-select: none;
  }

  .klant-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .klant-avatar {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .klant-naam {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.15rem;
  }

  .klant-meta {
    font-family: 'Syne Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .klant-badges {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .badge {
    padding: 0.2rem 0.6rem;
    border-radius: 3px;
    font-family: 'Syne Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .badge-platform { background: rgba(108,99,255,0.15); color: var(--accent); }
  .badge-orders { background: rgba(0,229,160,0.12); color: var(--green); }
  .badge-pijn { background: rgba(255,159,67,0.15); color: var(--orange); }

  .expand-icon {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform 0.3s;
    margin-left: 1rem;
  }

  .klant-card.open .expand-icon { transform: rotate(180deg); }

  /* DETAIL PANEL */
  .klant-detail {
    display: none;
    border-top: 1px solid var(--border);
  }

  .klant-card.open .klant-detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .detail-col {
    padding: 1.5rem;
  }

  .detail-col:first-child {
    border-right: 1px solid var(--border);
  }

  .detail-section-title {
    font-family: 'Syne Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
  }

  .info-row:last-child { border-bottom: none; }

  .info-label { color: var(--muted); }
  .info-value { font-weight: 500; text-align: right; max-width: 55%; }

  /* AUTOMATIONS */
  .auto-item {
    display: flex;
    gap: 0.75rem;
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.4rem;
    border-radius: 6px;
    font-size: 0.8rem;
    line-height: 1.5;
    background: var(--surface2);
    border-left: 3px solid transparent;
  }

  .auto-item.hoog { border-left-color: var(--accent2); }
  .auto-item.mid  { border-left-color: var(--accent); }
  .auto-item.laag { border-left-color: var(--green); }

  .auto-prio {
    font-family: 'Syne Mono', monospace;
    font-size: 0.58rem;
    padding: 0.15rem 0.35rem;
    border-radius: 3px;
    flex-shrink: 0;
    height: fit-content;
    margin-top: 2px;
    font-weight: 600;
  }

  .auto-item.hoog .auto-prio { background: rgba(255,101,132,0.2); color: var(--accent2); }
  .auto-item.mid  .auto-prio { background: rgba(108,99,255,0.2); color: var(--accent); }
  .auto-item.laag .auto-prio { background: rgba(0,229,160,0.15); color: var(--green); }

  /* SCORE */
  .score-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .score-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
  }

  .score-num {
    font-family: 'Syne Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    min-width: 45px;
  }

  /* SUCCES QUOTE */
  .succes-quote {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-left: 3px solid var(--green);
    background: rgba(0,229,160,0.05);
    font-size: 0.8rem;
    font-style: italic;
    color: var(--muted);
    border-radius: 0 4px 4px 0;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
  }

  .empty-state .big-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 1.5rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .detail-grid { grid-template-columns: 1fr; }
    .detail-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div id="login-screen" style="
  position:fixed;inset:0;background:#0a0a0f;z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;
">
  <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-0.02em">
    Niels<span style="color:#6c63ff">Auto</span> Dashboard
  </div>
  <div style="font-family:'Syne Mono',monospace;font-size:0.65rem;color:#6b6b85;text-transform:uppercase;letter-spacing:0.1em;margin-top:-1rem">
    Toegang vereist
  </div>
  <input id="pw-input" type="password" placeholder="Wachtwoord..." onkeydown="if(event.key==='Enter')checkPW()" style="
    padding:0.8rem 1.2rem;background:#111118;border:1px solid #2a2a38;
    color:#e8e8f0;font-family:'Inter',sans-serif;font-size:0.9rem;
    border-radius:6px;width:260px;outline:none;text-align:center;
  ">
  <button onclick="checkPW()" style="
    padding:0.7rem 2rem;background:#6c63ff;border:none;color:white;
    font-family:'Syne',sans-serif;font-weight:600;font-size:0.85rem;
    border-radius:6px;cursor:pointer;
  ">Inloggen</button>
  <div id="pw-error" style="color:#ff6584;font-size:0.78rem;font-family:'Syne Mono',monospace;display:none">
    Fout wachtwoord — probeer opnieuw
  </div>
</div>

<div class="glow"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">Niels<span>Auto</span></div>
  <div class="sidebar-sub">Dashboard v1.0</div>

  <div class="nav-label">Menu</div>

  <div class="sidebar-stats">
    <div class="stat-item">
      <div class="stat-label">Inzendingen</div>
      <div class="stat-value" id="sidebar-count">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Gem. uren/week</div>
      <div class="stat-value" id="sidebar-uren">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Meest gebruikt</div>
      <div class="stat-value" style="font-size:1rem;margin-top:0.3rem" id="sidebar-platform">—</div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <h1>Webshop <span>Scans</span></h1>
    <button class="btn-refresh" id="refresh-btn" onclick="laadData()">
      <span class="icon">↻</span> Vernieuwen
    </button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-card-label">Totaal inzendingen</div>
      <div class="stat-card-value" id="stat-totaal">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Gem. besparing/week</div>
      <div class="stat-card-value" id="stat-besparing">—u</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Meeste pijn</div>
      <div class="stat-card-value" style="font-size:1rem;padding-top:0.5rem" id="stat-pijn">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">E-mails verzameld</div>
      <div class="stat-card-value" id="stat-emails">—</div>
    </div>
  </div>

  <!-- KLANTEN -->
  <div id="klanten-container">
    <div class="loading-state">
      <div>Scans laden...</div>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
</main>

<script>
const API = 'https://api.sheetbest.com/sheets/35c7f7a2-a10d-4182-a359-8f915ccb811b';

// Zelfde automatiseringslogica als de vragenlijst
function berekenAutomations(row) {
  const platform = row.platform || '';
  const pijn = (row.pijnpunten || '').split(',').map(s => s.trim());
  const ads = (row.ads || '').split(',').map(s => s.trim());
  const doel = row.doel || '';
  const boekhouding = row.boekhouding || '';
  const email_tool = row.email_tool || '';

  let automations = [];

  if(pijn.includes('rapportage') || doel==='inzicht') {
    automations.push({ prio:'HOOG', cls:'hoog', titel:'📊 Dagelijks omzetrapport', beschrijving:'Elke ochtend automatisch bestellingen, omzet en top-producten in je mail.' });
  }
  if(ads.includes('meta') || ads.includes('google')) {
    automations.push({ prio:'HOOG', cls:'hoog', titel:'📣 Wekelijks advertentierapport', beschrijving:'Automatisch overzicht van Meta/Google campagnes: kosten, ROAS, CTR.' });
  }
  if(pijn.includes('voorraad')) {
    automations.push({ prio:'HOOG', cls:'hoog', titel:'⚠️ Lage voorraad alert', beschrijving:'Melding zodra een product onder de minimumdrempel komt.' });
  }
  if(pijn.includes('facturen') && boekhouding && boekhouding!=='geen') {
    automations.push({ prio:'HOOG', cls:'hoog', titel:'🧾 Automatische factuurverwerking', beschrijving:`Nieuwe bestelling → factuur in ${boekhouding} automatisch aangemaakt.` });
  }
  if(pijn.includes('klanten')) {
    automations.push({ prio:'MID', cls:'mid', titel:'💬 Retouropvolging', beschrijving:'Retourverzoek → automatisch bevestiging + instructies.' });
  }
  if(pijn.includes('inkoop')) {
    automations.push({ prio:'MID', cls:'mid', titel:'📦 Inkoopsignalering', beschrijving:'Systeem berekent wanneer bijbestellen en maakt conceptorder klaar.' });
  }
  if(email_tool && email_tool!=='geen') {
    automations.push({ prio:'MID', cls:'mid', titel:'✉️ Slimme e-mailsegmentatie', beschrijving:`Klanten automatisch ingedeeld op aankoopgedrag → juiste campagne via ${email_tool}.` });
  }
  if(pijn.includes('ads')) {
    automations.push({ prio:'MID', cls:'mid', titel:'🎯 Budget alert slechte ROAS', beschrijving:'Alert als advertentie onder gewenste ROAS zakt.' });
  }
  if(pijn.includes('producten')) {
    automations.push({ prio:'LAAG', cls:'laag', titel:'🏷️ Productupdates synchroniseren', beschrijving:'Prijswijzigingen automatisch doorgevoerd vanuit leveranciersfeed.' });
  }
  automations.push({ prio:'LAAG', cls:'laag', titel:'📅 Maandelijkse business review', beschrijving:'Volledig PDF-rapport elke maand: omzet, groei, trends vs vorige maand.' });

  const score = Math.min(100, automations.length * 12 + pijn.length * 5);
  const besparing = Math.round(parseInt(row.uren_pw || 8) * 0.6);
  return { automations, score, besparing };
}

function initialen(naam) {
  return (naam || '?').split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
}

function renderKlant(row, index) {
  const { automations, score, besparing } = berekenAutomations(row);
  const pijnList = (row.pijnpunten || '').split(',').map(s => s.trim()).filter(Boolean);

  return `
    <div class="klant-card" id="card-${index}" style="animation-delay:${index * 0.05}s">
      <div class="klant-header" onclick="toggleCard(${index})">
        <div class="klant-header-left">
          <div class="klant-avatar">${initialen(row.shop_naam)}</div>
          <div>
            <div class="klant-naam">${row.shop_naam || 'Onbekend'}</div>
            <div class="klant-meta">${row.datum || ''} · ${row.email || 'geen email'}</div>
          </div>
        </div>
        <div class="klant-badges">
          ${row.platform ? `<span class="badge badge-platform">${row.platform}</span>` : ''}
          ${row.orders_pm ? `<span class="badge badge-orders">${row.orders_pm}</span>` : ''}
          ${pijnList.length ? `<span class="badge badge-pijn">${pijnList.length} pijnpunten</span>` : ''}
          <span class="expand-icon">▼</span>
        </div>
      </div>

      <div class="klant-detail">
        <div class="detail-grid">
          <!-- LINKS: INFO -->
          <div class="detail-col">
            <div class="detail-section-title">Bedrijfsinfo</div>

            <div class="info-row">
              <span class="info-label">Platform</span>
              <span class="info-value">${row.platform || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Bestellingen/mnd</span>
              <span class="info-value">${row.orders_pm || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Teamgrootte</span>
              <span class="info-value">${row.team_size || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Advertenties</span>
              <span class="info-value">${row.ads || 'Geen'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Boekhouding</span>
              <span class="info-value">${row.boekhouding || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">E-mailtool</span>
              <span class="info-value">${row.email_tool || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Uren/week handmatig</span>
              <span class="info-value">${row.uren_pw || '—'}u → besparing ~${besparing}u</span>
            </div>
            <div class="info-row">
              <span class="info-label">Technisch niveau</span>
              <span class="info-value">${row.tech || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Hoofddoel</span>
              <span class="info-value">${row.doel || '—'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Pijnpunten</span>
              <span class="info-value">${row.pijnpunten || '—'}</span>
            </div>

            ${row.inzicht_mis ? `
            <div style="margin-top:1rem">
              <div class="detail-section-title">Gemist inzicht</div>
              <div class="succes-quote" style="border-color:var(--orange);background:rgba(255,159,67,0.05)">${row.inzicht_mis}</div>
            </div>` : ''}

            ${row.succes_def ? `
            <div style="margin-top:1rem">
              <div class="detail-section-title">Succesdefinitie</div>
              <div class="succes-quote">"${row.succes_def}"</div>
            </div>` : ''}
          </div>

          <!-- RECHTS: AUTOMATIONS -->
          <div class="detail-col">
            <div class="detail-section-title">Automatiseringsplan</div>

            <div class="score-wrap">
              <div class="score-track">
                <div class="score-fill" style="width:${score}%"></div>
              </div>
              <div class="score-num">Score: ${score}/100</div>
            </div>

            ${automations.map(a => `
              <div class="auto-item ${a.cls}">
                <span class="auto-prio">${a.prio}</span>
                <div>
                  <strong style="font-size:0.82rem">${a.titel}</strong><br>
                  <span style="color:var(--muted);font-size:0.77rem">${a.beschrijving}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleCard(index) {
  const card = document.getElementById('card-' + index);
  card.classList.toggle('open');
}

async function laadData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('loading');

  try {
    const res = await fetch(API);
    const data = await res.json();

    const rijen = data.filter(r => r.shop_naam);

    // Stats berekenen
    document.getElementById('stat-totaal').textContent = rijen.length;
    document.getElementById('sidebar-count').textContent = rijen.length;

    const emails = rijen.filter(r => r.email).length;
    document.getElementById('stat-emails').textContent = emails;

    const urenGem = rijen.length
      ? Math.round(rijen.reduce((s, r) => s + parseInt(r.uren_pw || 0), 0) / rijen.length)
      : 0;
    const besparingGem = Math.round(urenGem * 0.6);
    document.getElementById('stat-besparing').textContent = besparingGem + 'u';
    document.getElementById('sidebar-uren').textContent = urenGem + 'u';

    // Meest voorkomende pijnpunt
    const pijnTelling = {};
    rijen.forEach(r => {
      (r.pijnpunten || '').split(',').forEach(p => {
        p = p.trim();
        if(p) pijnTelling[p] = (pijnTelling[p] || 0) + 1;
      });
    });
    const topPijn = Object.entries(pijnTelling).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('stat-pijn').textContent = topPijn ? topPijn[0] : '—';

    // Meest gebruikte platform
    const platTelling = {};
    rijen.forEach(r => { if(r.platform) platTelling[r.platform] = (platTelling[r.platform]||0)+1; });
    const topPlat = Object.entries(platTelling).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('sidebar-platform').textContent = topPlat ? topPlat[0] : '—';

    // Klanten renderen
    const container = document.getElementById('klanten-container');
    if(rijen.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="big-icon">📭</div>
          <h3>Nog geen inzendingen</h3>
          <p>Stuur de vragenlijst naar je eerste klant!</p>
        </div>`;
    } else {
      container.innerHTML = `<div id="klanten-grid">${rijen.reverse().map((r, i) => renderKlant(r, i)).join('')}</div>`;
    }

  } catch(err) {
    document.getElementById('klanten-container').innerHTML = `
      <div class="empty-state">
        <div class="big-icon">⚠️</div>
        <h3>Kon data niet laden</h3>
        <p>Controleer je internet en probeer opnieuw.</p>
      </div>`;
  }

  btn.classList.remove('loading');
}

const WACHTWOORD = 'niels2025';

function checkPW() {
  const input = document.getElementById('pw-input').value;
  if(input === WACHTWOORD) {
    document.getElementById('login-screen').style.display = 'none';
    laadData();
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
</script>
